services:
  db:
    image: mysql:8.4
    container_name: jobtrack-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_track
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jobtrack-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: "change-this-in-a-real-deployment"
      # The web container reaches MySQL over the internal docker network.
      DATABASE_URL: "mysql://app:app@db:3306/job_track?serverVersion=8.4.0&charset=utf8mb4"
      # Optional: automatically create an admin user on first boot.
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"

volumes:
  db_data:
